# Precios de los modelos de Anthropic — USD por millón de tokens (MTok), API de primera parte.
# Fuente: tabla de modelos del skill `claude-api` (cacheada 2026-10-06) y https://www.anthropic.com/pricing.
# Actualizar al publicarse un modelo o cambiar un precio. Clave = model ID exacto del campo `message.model`
# del transcript.
#
# Campos:
#   input_per_mtok, output_per_mtok
#   cache_write_per_mtok      escritura de caché con TTL de 5 min (1.25× la entrada)
#   cache_write_1h_per_mtok   escritura de caché con TTL de 1 h (2× la entrada)
#   cache_read_per_mtok       lectura de caché (0.1× la entrada, salvo donde se indica)
#   long_context_above_tokens / long_context_multiplier
#                             tramo de contexto largo: con un prompt mayor al umbral, todo el costo se
#                             multiplica (Haiku 5.5)
# Sin un campo de caché, el tracker usa esos múltiplos de la entrada.
# Los valores de caché salen de la regla general de la fuente (1.25× / 2× / ~0.1× la entrada), salvo las
# excepciones que se anotan (Fable 5.1, Opus 5.5). [asumido] marca lo que la fuente no dice.

claude-fable-5-1:
  input_per_mtok: 10.00
  output_per_mtok: 50.00
  cache_write_per_mtok: 12.50
  cache_write_1h_per_mtok: 20.00
  cache_read_per_mtok: 0.25          # 0.025× la entrada

